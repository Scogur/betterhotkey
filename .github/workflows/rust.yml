name: Release

# Runs when a version tag like v0.2.0 is pushed.
on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    name: Build Windows Exe and Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Tag Matches Cargo.toml Version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          fi

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Tests
        run: cargo test --release

      - name: Build Release Binary
        run: cargo build --release

      - name: Locate and Rename Binary
        shell: bash
        run: |
          cp target/release/betterhotkey.exe ./betterhotkey.exe

      - name: Create GitHub Release and Upload Exe
        uses: softprops/action-gh-release@v2
        with:
          name: "betterhotkey ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            betterhotkey.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
